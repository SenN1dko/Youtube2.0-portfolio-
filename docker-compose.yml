services:
  postgres:
    image: postgres:17-alpine
    container_name: youtube2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: amir8002
      POSTGRES_DB: Youtube2.0-db
    ports:
      - "5432:5432"
    volumes:
      - youtube2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Youtube2.0-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: youtube2-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - youtube2_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  youtube2_postgres_data:
  youtube2_redis_data:
